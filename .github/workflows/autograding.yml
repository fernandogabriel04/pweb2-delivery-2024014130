name: Autograding

# Roda a cada push (e manualmente). Corrige a conformidade da API (comportamento).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autograding:
    runs-on: ubuntu-latest
    env:
      # Banco SQLite do CI (caminho relativo à pasta prisma/).
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Gerar Prisma Client e aplicar migrations
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Subir o servidor
        run: |
          PORT=3000 npm start &
          for i in $(seq 1 20); do curl -sf http://localhost:3000/api/health && break; sleep 1; done

      # A API JSON foi substituída pela interface web (Atividade 08), então o
      # autograder antigo (autograder/check.mjs, API JSON do Cap. 4) não se aplica.
      # Como não encontrei o autograder SSR oficial criei um validando algumas coisas criadas nessa etapa.
      - name: Corrigir (verificador SSR)
        run: BASE_URL=http://localhost:3000 node autograder/check-ssr.mjs
